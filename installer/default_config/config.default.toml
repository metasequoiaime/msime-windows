#
# Helpcode
# 辅助码
#
[helpcode]
# 双拼辅助码
shuangpin_helpcode = false
# 双拼辅助码方案，可选："lantian", "ziranma", "shouyou2_0", "shouyouplus", "xiaohe", "jiajia"，
# 或 "custom/<文件名>"（数据目录 helpcodes\custom\<文件名>.txt 中的自定义方案）
shuangpin_helpcode_schema = "lantian"
# 是否在候选窗口中显示双拼辅助码
show_sp_helpcode_in_candidate_window = true
# 双拼末尾辅助码直接触发：音节后直接接辅码，完整音节后多一个键是单码（如 ulpbx），末尾两键带大写是
# 双码（如 ulpbxY）。关闭后改由下面的触发键引导（间接），不敲触发键时末尾的字母一律按拼音读
shuangpin_helpcode_direct = true
# 末尾辅助码间接触发时的触发键，可多选：反引号（`）、分号（;）和大写字母。触发键后接一到两个辅码，
# 大小写均可（如 ulpb;xy）；大写字母触发时第一码敲成大写（如 ulpbXy）。辅码要在输入串末尾，一码重排、
# 两码筛选。与句中辅助码的触发键互斥：设置页勾上一边的某个键会取消另一边的同一个键，另一边因此一个
# 不剩时它的引导键不生效；两边都写成 true 时归句中辅助码
shuangpin_helpcode_trigger_backtick = false
shuangpin_helpcode_trigger_semicolon = true
shuangpin_helpcode_trigger_uppercase = false
# 双拼句中辅助码：在完整音节后敲反引号（`），后面的字母筛这个音节上的字。第一码大小写均可，
# 第二码要用大写才参与筛选（如 ulpb`xY），之后可以接着打。整句候选会带着锁住的字重新打分
shuangpin_mid_sentence_helpcode = false
# 句中辅助码的触发键，可多选：反引号（`）和分号（;）。微软/搜狗/紫光双拼里分号还是 ing 韵母，
# 只有在完整音节后才当触发键。与末尾辅助码（间接）的触发键互斥，见上
shuangpin_mid_sentence_helpcode_backtick = true
shuangpin_mid_sentence_helpcode_semicolon = false
# 第三种触发键：完整音节后的大写字母，相当于「反引号 + 这个字母」（如 ulpbXihfa ≡ ulpb`xihfa），
# 第二码仍要大写（ulpbXYih ≡ ulpb`xYih）。开启后这个位置的大写字母不再当末尾双码辅助
shuangpin_mid_sentence_helpcode_uppercase = false
# 双拼直接辅助码（万象式）：不要引导键，音节后直接接辅码。三码（双拼 + 第一位辅码，如 uia）自动识别、
# 整句断句；四码（双拼 + 两位辅码）单独敲时直接定字，句中要在后面补一个 /（如 uiab/）。与上面的句中
# 辅助码互斥：设置页开启其中一个会自动关闭另一个；两个都写成 true 时按直接辅助码生效。开启后末尾辅助码
# 也让位给它
shuangpin_direct_helpcode = false
# 直接辅助码句中四码的结束方式，可多选、至少留一个：两位辅码后补 /（如 uiab/），或把第二位辅码敲成大写
# （如 uiaB）。开启大写后大写字母只当四码的第二位辅码；都写成 false 时按补 / 生效
shuangpin_direct_helpcode_slash = true
shuangpin_direct_helpcode_uppercase = false
# 直接辅助码下用引导键进入末尾辅助码：引导键是上面末尾辅助码勾了的反引号、分号（大写字母在直接辅助码里
# 本身是辅码，不算）。前面每一节都能看成「完整双拼 + 0~2 个辅码」时，在输入末尾敲引导键会把各音节上的辅码
# 删掉、整理成纯双拼（如 uixulpb 敲 ; 变成 uiulpb;），后面接一到两个辅码按末尾辅助码筛候选（一码重排、两码
# 筛选）；退格删掉这个引导键时恢复整理前的输入。只在直接辅助码开着时生效。微软/搜狗/紫光双拼里分号跟在字母
# 后面时是 ing 韵母，这些方案请用反引号
shuangpin_direct_helpcode_end_trigger = false
# 全拼辅助码
quanpin_helpcode = false
# 全拼辅助码方案，可选："lantian", "ziranma", "shouyou2_0", "shouyouplus", "xiaohe", "jiajia"，
# 或 "custom/<文件名>"（数据目录 helpcodes\custom\<文件名>.txt 中的自定义方案）
quanpin_helpcode_schema = "ziranma"
# 是否在候选窗口中显示全拼辅助码
show_qp_helpcode_in_candidate_window = false

#
# Quanpin
# 全拼
#
[quanpin]
# 全拼自动纠错：遇到按键窜乱时自动按最接近的正确拼音查询候选。
# 仅当输入串不是合法拼音组合时触发，不影响正常输入；四种类型默认全部关闭，
# 可在设置页分别开启。四个开关各管一类手误、互不联动：只开哪个就只纠哪种。
# 旧的单键 autocorrect 已废弃，不再读取；漏字 / 多字两个键是新增的，缺失时按关闭处理。
# 相邻字母顺序打错时纠正（如 sahng → shang）。
autocorrect_transposition = false
# 误触相邻按键时纠正（如 shabg → shang）。
autocorrect_neighbor = false
# 漏敲一个字母时纠正（如 shng → shang）。
autocorrect_deletion = false
# 多敲一个相邻按键时纠正（如 sjhang → shang）。
autocorrect_insertion = false
# 纠错得到的候选在末尾显示 * 标记，便于和正常候选区分；只影响显示，不影响上屏文字。
autocorrect_marker = true

