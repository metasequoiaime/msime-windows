# 水杉输入法 schema_version 2 测试皮肤「排布与平铺」。
# 用来实机核对两件事：按排布覆盖（横排、竖排各用一套面板图、平铺方式、内边距、外留白和挂件），
# 以及九宫格的 round / space 平铺。四边中段每块画一个记号，数记号就知道铺了几块；四角的粉色方块永远不该被铺或拉伸。
# 所有图片由 tools/gen_layout_tiles.py 程序生成，随本目录以 MIT 授权；都是 2 倍图（像素尺寸是下面 *_dip 的两倍）。

schema_version = 2
id = "layout-tiles"
name = "排布与平铺 · v2 测试"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "测试用：横排琥珀圆点面板按 space 平铺、竖排青色菱形面板按 round 平铺，挂件、内边距与外留白按排布区分。"
base = "canvas"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = "7em"              # 最小宽度按字号算，0–10em；共用表和下面的分表都可以写 em
item_corner_radius_dip = 5
line_gap_dip = 4

# 版式键的按排布覆盖：横排把预编辑行上移 2 DIP、下边多留 6 DIP（外边距可以写负值，上右下左）；
# 竖排把最小宽度抬到 10 字宽，和横排一眼能分出来。
[candidate_window.horizontal]
preedit_margin_dip = [-2, 0, 6, 0]

[candidate_window.vertical]
min_width_dip = "10em"

# 共用面板：72×72 的 2 倍图，切片 24 像素、边框画 12 DIP，四边中段各一颗青色菱形。
# 下面横排换了自己的图，所以实际只有竖排用到它。
[candidate_window.border_image]
source = "assets/panel.png"
light_source = "assets/panel-light.png"
slice_dip = [24]
width_dip = [12]

# 横排换成琥珀圆点面板。换了 source 就要一并写 light_source，不会继承共用那张浅色图。
# space：上下边按原尺寸平铺，剩余空间均分成圆点之间的空隙；左右边拉伸，只有一颗被拉长的圆点。
[candidate_window.border_image.horizontal]
source = "assets/panel-h.png"
light_source = "assets/panel-h-light.png"
repeat = ["space", "stretch"]

# 竖排沿用共用面板。round：左右边铺整数块并等比缩放，菱形两端正好收口、不会被裁一半；上下边拉伸。
[candidate_window.border_image.vertical]
repeat = ["stretch", "round"]

# 内容离面板外缘的距离。竖排左侧多留 12 DIP，文字明显右移。
[candidate_window.content_insets_dip]
top = 14
right = 16
bottom = 14
left = 16

[candidate_window.content_insets_dip.vertical]
left = 28

# 挂件伸出面板时的窗口留白：横排的标签挂在左下，竖排的挂在右上，各自只给自己那一侧留空。
[candidate_window.outer_insets_dip]
top = 0
right = 0
bottom = 0
left = 0

[candidate_window.outer_insets_dip.horizontal]
bottom = 14
left = 14

[candidate_window.outer_insets_dip.vertical]
top = 14
right = 14

# 横排专用：三道横杠的琥珀标签，竖排里不该出现。
[[candidate_window.decorations]]
image = "assets/badge-h.png"
anchor = "bottom-left"
offset_x_dip = -12
offset_y_dip = 12
width_dip = 24
height_dip = 24
z_index = 2
layouts = ["horizontal"]

# 竖排专用：三道竖杠的青色标签，横排里不该出现。
[[candidate_window.decorations]]
image = "assets/badge-v.png"
anchor = "top-right"
offset_x_dip = 12
offset_y_dip = -12
width_dip = 24
height_dip = 24
z_index = 2
layouts = ["vertical"]

[candidate.dark]
accent = "#fdba3c"
selected = "rgba(253, 186, 60, 0.20)"
hover = "rgba(253, 186, 60, 0.10)"
text = "#eef2ff"
number = "rgba(238, 242, 255, 0.60)"

[candidate.light]
accent = "#c27a0e"
selected = "rgba(194, 122, 14, 0.16)"
hover = "rgba(194, 122, 14, 0.08)"
text = "#2a2418"
number = "rgba(42, 36, 24, 0.55)"

[license]
code = "MIT"
assets = "MIT"
source = "Procedurally generated by the Metasequoia IME contributors."
