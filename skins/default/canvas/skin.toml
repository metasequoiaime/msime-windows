# 全贴图基底「canvas」的出厂清单：v2 外部皮肤（base = "canvas"）没写的外观沿用这里的值。
# 面板透明、无描边、直角、默认没有阴影，外观交给皮肤自己的九宫格贴图与挂件；文字与高亮取不依赖底色的中性色，
# 叠在大多数贴图上都可读。canvas 不能单独选用，开关沿用 fluent 的清单。
# 安装或升级时整份覆盖，不建议直接修改。字段说明见 skins/README.md。
schema_version = 1
id = "canvas"
name = "Canvas"
description = "全贴图基底：透明面板，外观来自皮肤自己的九宫格贴图与挂件"

[candidate_window]
corner_radius_dip = 0
border_width_dip = 0
item_corner_radius_dip = 4
# 皮肤写了 soft / strong 才有阴影。
shadow = "none"
padding = 5
item_gap = 2
item_extra_height = 2
number_inset = 5
item_padding_right = 0
number_scale = 0.8
number_gap = 1.5
selected_bar_width = "0.17em"
selected_bar_height_em = 0.85
selected_bar_inside = false
item_corners_follow_card = false
justify_rows = false
trim_hidden_preedit_gap = false
page_arrow_style = "chevron"
preedit_margin_dip = [0, 0, 0, 0]

[candidate.dark]
# 透明底色仍带上 fluent 的底色 RGB，不能透明的使用方压平时得到的是可读的底色而不是黑色。
surface = "#20202000"
border = "transparent"
text = "#F2F2F2"
number = "rgba(242, 242, 242, 0.62)"
accent = "#6B69D6"
selected = "rgba(255, 255, 255, 0.16)"
hover = "rgba(255, 255, 255, 0.09)"
show_selected_bar = true
translation = "#9A6DD7"
translation_pos = "#E255A180"
translation_separator = "#9A6DD773"

[candidate.dark.menu]
background = "#2D2D2D"
border = "#9b9b9b2e"
text = "#E9E8E8"
hover = "#414141"

[candidate.light]
surface = "#FFFFFF00"
border = "transparent"
text = "#1A1A1A"
number = "rgba(26, 26, 26, 0.6)"
accent = "#6B69D6"
selected = "rgba(0, 0, 0, 0.10)"
hover = "rgba(0, 0, 0, 0.06)"
show_selected_bar = true
translation = "#6940A5"
translation_pos = "#AD1A7280"
translation_separator = "#6940A573"

[candidate.light.menu]
background = "#FFFFFF"
border = "rgba(0, 0, 0, 0.12)"
text = "#1A1A1A"
hover = "#ECECEC"

[toolbar]
corner_radius_dip = 8
icon_corner_radius_dip = 6

[toolbar.dark]
background = "#1A1A1A"
border = "rgba(255, 255, 255, 0.15)"
icon = "#FFFFFF"
hover = "rgba(255, 255, 255, 0.10)"
divider = "rgba(255, 255, 255, 0.15)"
handle = "#6B69D6"

[toolbar.light]
background = "#FFFFFF"
border = "rgba(0, 0, 0, 0.12)"
icon = "#1A1A1A"
hover = "rgba(0, 0, 0, 0.08)"
divider = "rgba(0, 0, 0, 0.12)"
handle = "#6B69D6"
