source = "布朗熊动图（LINE FRIENDS）、候选框右上角的猫猫虫动图、左下角的抱樱花小白猫、正下方的倒挂少女与右下角的野猪头少年来自网络，按钮圆底与候选窗面板由 Metasequoia IME contributors 程序生成。"
