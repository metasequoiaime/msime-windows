border = "#8C6A50"
accent = "#F2AD68"
text = "#F9EBDD"
candidate_text = "#F9EBDD"
preedit_text = "#F9EBDD"
preedit_caret = "#F2AD68"
number = "#C9AB91"
selected = "#64442F"
hover = "#463328"
translation = "#D7B99C"
translation_pos = "#C9AB91"
translation_separator = "#A98A70"
selected_text = "#FFF4E8"
