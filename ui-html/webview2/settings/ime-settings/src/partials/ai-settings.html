<div class="content" id="ai-assistant-settings">
  <div class="content-header"><span>AI 辅助</span></div>
  <div class="section ai-section">
    <div class="section-header">
      <div><div class="section-title">启用 AI 联想</div><div class="ai-description">在全拼和双拼输入时异步生成第 3 个候选项</div></div>
      <div class="ftb-toggle-btn" id="aiEnabled" role="switch" aria-checked="false" tabindex="0"><div class="ftb-toggle-knob"></div></div>
    </div>
  </div>
  <div class="section ai-section">
    <div class="section-title ai-heading">API 配置</div>
    <div class="ai-description ai-api-description">DeepSeek、OpenAI、SiliconFlow、Groq 均使用 OpenAI 兼容的 Chat Completions 接口。Custom 用于接入任意兼容服务，填写自己的接口地址与模型。每个提供商的接口地址、Token 和模型分开保存。</div>
    <div class="ai-grid">
      <div class="ai-field">
        <span>服务提供商</span>
        <div class="dropdown">
          <button class="dropdown-toggle" id="aiProviderBtn" type="button">
            <span>DeepSeek</span>
            <img src="./assets/arrow.svg" alt="">
          </button>
          <div class="dropdown-menu" id="aiProviderMenu">
            <div class="dropdown-item" data-value="deepseek">DeepSeek</div>
            <div class="dropdown-item" data-value="openai">OpenAI</div>
            <div class="dropdown-item" data-value="siliconflow">SiliconFlow</div>
            <div class="dropdown-item" data-value="groq">Groq</div>
            <div class="dropdown-item" data-value="custom">Custom</div>
          </div>
        </div>
      </div>
      <div class="ai-field">
        <span>模型</span>
        <div class="ai-model-row">
          <div class="dropdown ai-model-dropdown">
            <div class="dropdown-toggle" id="aiModelBtn">
              <input id="aiModel" type="text" autocomplete="off" spellcheck="false"
                     aria-label="模型名称" aria-controls="aiModelMenu" aria-autocomplete="list">
              <div class="arrow"><img src="./assets/arrow.svg" alt=""></div>
            </div>
            <div class="dropdown-menu font-dropdown-menu compact-scroll-menu" id="aiModelMenu"></div>
          </div>
          <button id="aiModelFetchButton" class="ai-model-fetch-button" type="button" title="按当前服务商和凭据获取可用模型">获取模型</button>
        </div>
        <div class="ai-model-actions">
          <button id="aiCredentialTestButton" class="credential-test-button" type="button">测试连接</button>
          <span id="aiCredentialTestStatus" class="credential-test-status" role="status" aria-live="polite"></span>
        </div>
        <span id="aiModelFetchStatus" class="ai-model-fetch-status" role="status" aria-live="polite"></span>
      </div>
      <div class="ai-field">
        <label for="aiToken">API Token</label>
        <span class="ai-secret-input">
          <input id="aiToken" type="password" autocomplete="off" spellcheck="false">
          <button id="aiTokenVisibility" class="ai-secret-toggle" type="button" aria-label="显示 API Token" aria-pressed="false" title="显示 API Token">
            <svg class="ai-secret-icon ai-secret-icon-show" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.75"></circle>
            </svg>
            <svg class="ai-secret-icon ai-secret-icon-hide" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 6.1A9.2 9.2 0 0 1 12 6c6 0 9.5 6 9.5 6a16.7 16.7 0 0 1-2.6 3.2M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a9 9 0 0 0 3-.5"></path>
              <path d="M9.8 9.8a3 3 0 0 0 4.4 4.4"></path>
            </svg>
          </button>
        </span>
      </div>
      <label><span>候选数量</span><input id="aiCandidateLimit" type="number" min="1" max="10" autocomplete="off"></label>
      <label class="ai-wide"><span>接口地址</span><input id="aiEndpoint" type="url" autocomplete="off" spellcheck="false"></label>
    </div>
  </div>
  <div class="section ai-section">
    <div class="ai-prompt-header">
      <div class="ai-field">
        <span>自定义提示词</span>
        <div class="dropdown">
          <button class="dropdown-toggle" id="aiPromptSlotBtn" type="button">
            <span>自定义一</span>
            <img src="./assets/arrow.svg" alt="">
          </button>
          <div class="dropdown-menu" id="aiPromptSlotMenu">
            <div class="dropdown-item" data-value="custom_1">自定义一</div>
            <div class="dropdown-item" data-value="custom_2">自定义二</div>
            <div class="dropdown-item" data-value="custom_3">自定义三</div>
          </div>
        </div>
      </div>
    </div>
    <textarea id="aiPrompt" class="ai-prompt" autocomplete="off" spellcheck="false"></textarea>
  </div>
</div>
